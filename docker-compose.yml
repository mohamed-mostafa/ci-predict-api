version: '3'

services:
    api-authorship:
        build:
            context: .
            dockerfile: Dockerfile
        image: api
        ports:
            - 8081:8081
        container_name: api-authorship
        restart: unless-stopped
        environment:
            VIRTUAL_HOST: api.blwahda.com
            LETSENCRYPT_HOST: api.blwahda.com
            LETSENCRYPT_EMAIL: blwahdastores@gmail.com

networks:
    default:
        external:
            name: nginx-proxy
